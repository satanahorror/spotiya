name: Build aarch64 (experimental)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  aarch64:
    name: aarch64 buster
    runs-on: ubuntu-22.04
    container:
      image: debian:buster
    timeout-minutes: 60
    steps:
      - name: Fix sources (buster archive) + add arm64
        run: |
          set -e
          cat > /etc/apt/sources.list <<EOF
          deb [arch=amd64] http://archive.debian.org/debian buster main
          deb [arch=amd64] http://archive.debian.org/debian-security buster/updates main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid
          dpkg --add-architecture arm64
          cat >> /etc/apt/sources.list <<EOF
          deb [arch=arm64] http://archive.debian.org/debian buster main
          deb [arch=arm64] http://archive.debian.org/debian-security buster/updates main
          EOF
          apt-get update
      - name: Install deps + node20
        run: |
          set -e
          apt-get install -y --no-install-recommends curl ca-certificates gnupg git build-essential pkg-config
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libasound2-dev:arm64
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          . "$HOME/.cargo/env"
          rustup target add aarch64-unknown-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/spotiya dist/
          tar -czf dist/spotiya-aarch64-linux-gnu.tar.gz -C dist spotiya
          cd dist && sha256sum spotiya-aarch64-linux-gnu.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: spotiya-aarch64-linux-gnu
          path: dist/*
